[project]
name = "sanct-classifier"
version = "0.1.0"
description = "Spam classification and ClamAV scanning for Sanct inbound mail"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
train = [
  "huggingface_hub>=0.30",
  "numpy>=2.1",
  "pyarrow>=18",
  "scikit-learn>=1.6",
  "scipy>=1.14",
]

[tool.uv]
package = false
default-groups = ["train"]
